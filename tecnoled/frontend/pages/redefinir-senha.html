<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B3D2E">
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="/images/img-73.jpg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/conta.css">
<title>Nova senha | Tecno LED</title></head>
<body class="acc" data-page="redefinir">
<a class="skip" href="#main">Pular para o conteúdo</a>
<header><div class="w bar">
<a class="logo" href="/" aria-label="Tecno LED, voltar ao site" style="display:flex;align-items:center;gap:10px"><img src="/images/img-73.jpg" alt="" width="104" height="54" style="width:104px;height:54px;object-fit:contain;border-radius:6px;background:#000"><span>TECNO <b>LED</b></span></a>
<div class="acc-nav"><a href="/">Voltar ao site</a></div>
</div></header>
<main id="main" tabindex="-1">
<div class="auth"><div class="auth-card">
<h1>Criar nova senha</h1>
<div class="alert" id="msg" role="status" hidden></div>
<form id="f" novalidate>
<label for="senha">Nova senha</label>
<div class="pw"><input id="senha" name="senha" type="password" autocomplete="new-password" required aria-invalid="false" aria-describedby="e-senha hint-senha"><button type="button" aria-pressed="false" aria-label="Mostrar ou ocultar a senha">Mostrar</button></div>
<div class="meter" aria-hidden="true"><i></i></div>
<div class="hint" id="hint-senha">Mínimo de 8 caracteres, com letras e números.</div>
<div class="err" id="e-senha"></div>
<label for="confirmarSenha">Confirme a nova senha</label>
<div class="pw"><input id="confirmarSenha" name="confirmarSenha" type="password" autocomplete="new-password" required aria-invalid="false" aria-describedby="e-confirmarSenha"><button type="button" aria-pressed="false" aria-label="Mostrar ou ocultar a confirmação">Mostrar</button></div>
<div class="err" id="e-confirmarSenha"></div>
<button class="btn full" type="submit">Salvar nova senha</button>
</form>
<div class="auth-links"><a href="/entrar">Voltar ao login</a><a href="/esqueci-senha">Pedir novo link</a></div>
</div></div>
</main>
<footer><div class="w"><p>© Tecno LED Painéis Eletrônicos · <a href="/#privacidade">Política de privacidade</a> · <a href="/#termos">Termos de uso</a></p></div></footer>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
