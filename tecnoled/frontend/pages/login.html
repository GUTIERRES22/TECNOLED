<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B3D2E">
<meta name="robots" content="noindex">
<link rel="icon" type="image/jpeg" href="/images/img-73.jpg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/conta.css">
<title>Entrar | Tecno LED</title></head>
<body class="acc" data-page="login">
<a class="skip" href="#main">Pular para o conteúdo</a>
<header><div class="w bar">
<a class="logo" href="/" aria-label="Tecno LED, voltar ao site" style="display:flex;align-items:center;gap:10px"><img src="/images/img-73.jpg" alt="" width="104" height="54" style="width:104px;height:54px;object-fit:contain;border-radius:6px;background:#000"><span>TECNO <b>LED</b></span></a>
<div class="acc-nav"><a href="/">Voltar ao site</a></div>
</div></header>
<main id="main" tabindex="-1">
<div class="auth"><div class="auth-card">
<h1>Entrar na sua conta</h1>
<p class="sub">Acompanhe seus orçamentos e peça novos com mais rapidez.</p>
<div class="alert" id="msg" role="status" hidden></div>
<form id="f" novalidate>
<label for="email">E-mail</label>
<input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-invalid="false" aria-describedby="e-email">
<div class="err" id="e-email"></div>
<label for="senha">Senha</label>
<div class="pw"><input id="senha" name="senha" type="password" autocomplete="current-password" required aria-invalid="false" aria-describedby="e-senha"><button type="button" aria-pressed="false" aria-label="Mostrar ou ocultar a senha">Mostrar</button></div>
<div class="err" id="e-senha"></div>
<label class="chk" for="lembrar" style="font-weight:400"><input id="lembrar" name="lembrar" type="checkbox"><span>Permanecer conectado neste dispositivo <span class="hint">(use apenas em aparelhos seus)</span></span></label>
<button class="btn full" type="submit">Entrar</button>
</form>
<div class="auth-links"><a href="/esqueci-senha">Esqueci minha senha</a><a href="/cadastro">Criar minha conta</a></div>
</div></div>
</main>
<footer><div class="w"><p>© Tecno LED Painéis Eletrônicos · <a href="/#privacidade">Política de privacidade</a> · <a href="/#termos">Termos de uso</a></p></div></footer>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
